<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuby Paint">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#43c463">
<title>Kuby: Paint Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: one-screen game — top bar, small pixel-paper canvas that fills in, dense 8x8 pencil grid below. Single bright theme by choice. */
:root{
  --bg:#e7e3da; --bg2:#d9d3c6; --ink:#2a2f4a; --muted:#625e70; --paper:#fbfaf6; --grid:#ece8de; --well:#f3f0e9; --warn:#e8455f;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);font-family:var(--display);
  display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:8px;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}
.bar{width:min(100%,460px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-top:4px}
.bar .roundbtn{justify-self:start}.bar .coins{justify-self:end}
/* wooden level plaque */
.lvl{position:relative;display:flex;align-items:baseline;gap:8px;white-space:nowrap;padding:5px 22px 7px;border-radius:14px;color:#fff;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 11px),linear-gradient(180deg,#e2a768,#c27f43 55%,#a8652f);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.18),0 4px 10px rgba(80,40,10,.22)}
.lvl::before,.lvl::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:#8a5228;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.lvl::before{left:8px}.lvl::after{right:8px}
.lvl small{font-size:.8rem;font-weight:700;letter-spacing:.14em;-webkit-text-stroke:3px #6b3410;paint-order:stroke}
.lvl b{font-size:1.6rem;line-height:1;font-weight:700;-webkit-text-stroke:4px #6b3410;paint-order:stroke;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 1px 3px rgba(42,47,74,.15)}
.seg button{font-family:var(--display);font-weight:600;font-size:.8rem;border:0;background:none;color:var(--muted);padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
@media (max-width:420px){.seg button{font-size:.72rem;padding:6px 8px}}
.top{width:min(100%,560px);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.paperwrap{position:relative;z-index:2;background:#fbf8f1;padding:7px;border-radius:3px;
  box-shadow:0 0 0 5px #c98447,0 0 0 7px #9a5c2c,0 8px 16px rgba(42,47,74,.25)}
/* şövale */
.easel{position:relative;padding-top:10px;padding-bottom:26px;padding-inline:4px;flex:none}
.easel .leg{position:absolute;width:9px;border-radius:4px;background:linear-gradient(90deg,#d99a5e,#b87439 60%,#9a5c2c);box-shadow:0 1px 2px rgba(42,47,74,.25)}
.easel .leg.l{left:20%;top:0;bottom:0;rotate:12deg;transform-origin:top center;z-index:1}
.easel .leg.r{right:20%;top:0;bottom:0;rotate:-12deg;transform-origin:top center;z-index:1}
.easel .leg.b{left:calc(50% - 4px);top:-4px;bottom:6px;width:8px;background:#8a5228;z-index:0}
.easel .peg{position:absolute;left:calc(50% - 14px);top:2px;width:28px;height:12px;border-radius:3px;background:#b87439;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);z-index:3}
.easel .ledge{position:absolute;left:-6px;right:-6px;bottom:18px;height:10px;border-radius:3px;background:linear-gradient(180deg,#d99a5e,#a8652f);box-shadow:0 2px 3px rgba(42,47,74,.3);z-index:3}
.pic{display:grid;grid-template-columns:repeat(16,1fr);gap:1px;width:var(--pw,min(70vw,280px));aspect-ratio:1}
.px{border-radius:2px;background:#e4dfd4;box-shadow:inset -1px -1.5px 0 rgba(0,0,0,.08),inset 1px 1px 0 rgba(255,255,255,.7)}
.px.on{box-shadow:inset -1px -2px 0 rgba(0,0,0,.2),inset 1px 1px 0 rgba(255,255,255,.45);animation:ink .3s ease-out}
@keyframes ink{0%{scale:0;border-radius:50%}70%{scale:1.3}100%{scale:1}}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:none;width:118px}
.side .roundbtn{width:50px;height:50px}
.side .roundbtn svg{width:28px;height:28px}
.side .prog{width:100%}
.roundbtn{width:44px;height:44px;border:0;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 35% 28%,#b8ecff 0 20%,#4cb8f0 55%,#1f86c8);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 3px #fff,0 4px 0 3px #1d6fa3}
.roundbtn:active{transform:translateY(2px)}
.roundbtn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.roundbtn svg{width:24px;height:24px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.iconbtn{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:.85rem;border:0;border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#6fd0ff,#2f9fe0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 #1d6fa3;-webkit-text-stroke:3px #1d5f8c;paint-order:stroke}
.iconbtn:active{transform:translateY(2px)}
.iconbtn svg{width:22px;height:22px;background:#fff;border-radius:50%;padding:3px;box-sizing:border-box}
.picname{font-size:.75rem;font-weight:700;color:#8a5228;text-transform:uppercase;letter-spacing:.12em}
.prog{width:110px;height:14px;background:#fbf6ec;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(100,55,15,.25),0 0 0 3px #c27f43}
.prog i{display:block;height:100%;width:0;border-radius:99px;transition:width .3s;background:linear-gradient(180deg,#7fe08f,#2fa84f);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.moves{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(circle at 40% 30%,#fffdf6,#f6ead4);font-variant-numeric:tabular-nums;
  box-shadow:inset 0 -4px 0 rgba(150,90,30,.15),0 0 0 6px #c98447,0 0 0 9px #9a5c2c,0 8px 14px rgba(80,40,10,.28)}
.moves small{font-size:.62rem;font-weight:700;letter-spacing:.14em;color:#9a5c2c}
.moves b{font-size:2.4rem;line-height:1;color:var(--ink);font-weight:700}
.moves.low b{color:var(--warn)}
.moves.bump b{animation:hit .25s}
@keyframes hit{50%{scale:1.25 .85}}
.board{position:relative;width:var(--bw,min(100%,420px));aspect-ratio:1;margin-block:8px 4px;flex:none}
/* the board is a wooden tray; painters perch on its rim */
.frame{position:absolute;inset:calc(100% * .74 / 9.24);border-radius:24px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 11px),linear-gradient(180deg,#e2a768,#c27f43 55%,#a8652f);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.18),0 8px 16px rgba(80,40,10,.25)}
.well{position:absolute;inset:calc(100% * 1.12 / 9.24 - 5px);background:#fbf6ec;border-radius:14px;box-shadow:inset 0 3px 7px rgba(100,55,15,.28)}
.cell{position:absolute}
.piece{border:0;background:none;padding:calc(var(--cell,40px) * .07);cursor:pointer;z-index:3}
.piece svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 1.5px rgba(42,47,74,.3))}
.piece:focus-visible{outline:3px solid var(--ink);outline-offset:-1px;border-radius:8px}
.piece.fly{pointer-events:none;z-index:8}
.piece.fly svg{animation:crawl .16s ease-in-out infinite}
@keyframes crawl{50%{scale:1.06 .9}}
.jars{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap;position:relative;z-index:1}
.jar{position:absolute;width:calc(100%/10);height:calc(100%/10);display:grid;place-items:center;z-index:2}
.jar .in{position:relative;width:74%;height:88%}
.jar .lid{position:absolute;left:12%;right:12%;top:0;height:16%;border-radius:3px;background:#6b6578;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.jar .glass{position:absolute;left:0;right:0;top:14%;bottom:0;border-radius:6px 6px 12px 12px;background:rgba(255,255,255,.55);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 2px 4px rgba(42,47,74,.18);overflow:hidden}
.jar .paint{position:absolute;left:0;right:0;bottom:0;background:var(--c);transition:height .25s;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.jar .glass::after{content:"";position:absolute;left:14%;top:12%;width:10%;bottom:20%;border-radius:2px;background:rgba(255,255,255,.6)}
.jar.dip{animation:dip .35s}
@keyframes dip{40%{scale:1.15 .9}}
.jar.empty{opacity:.45}
/* boya canavarları */
.mon .in{width:78%;height:78%}
.mon .body{position:absolute;inset:0;border-radius:50% 50% 44% 44%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.5) 0 14%,transparent 15%),var(--c);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 3px rgba(42,47,74,.28)}
.mon .eyes{position:absolute;top:24%;left:16%;right:16%;display:flex;justify-content:space-between}
.mon .eyes i{width:36%;aspect-ratio:1;background:#fff;border-radius:50%;position:relative;animation:blink 4s infinite;animation-delay:var(--dl)}
.mon .eyes i::after{content:"";position:absolute;width:52%;height:52%;left:24%;top:24%;background:#2a2f4a;border-radius:50%;translate:var(--px,0) var(--py,0)}
@keyframes blink{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.mon .mouth{position:absolute;left:36%;right:36%;top:64%;height:12%;border-radius:0 0 999px 999px;background:#2a2f4a;transition:all .15s}
.mon .cheek{position:absolute;top:58%;width:16%;height:9%;border-radius:50%;background:rgba(255,255,255,.35)}
.mon .cheek.l{left:12%}.mon .cheek.r{right:12%}
.mon .ex{position:absolute;inset:0;pointer-events:none}
.mon .ex.ears::before,.mon .ex.ears::after{content:"";position:absolute;top:-10%;width:30%;height:30%;border-radius:50%;background:var(--c);z-index:-1}
.mon .ex.ears::before{left:2%}.mon .ex.ears::after{right:2%}
.mon .ex.horns::before,.mon .ex.horns::after{content:"";position:absolute;top:-16%;width:18%;height:26%;background:#fff6e0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.mon .ex.horns::before{left:18%;rotate:-15deg}.mon .ex.horns::after{right:18%;rotate:15deg}
.mon .ex.ant::before{content:"";position:absolute;left:48%;top:-22%;width:5%;height:26%;background:#2a2f4a;border-radius:2px}
.mon .ex.ant::after{content:"";position:absolute;left:39%;top:-32%;width:22%;height:22%;border-radius:50%;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.mon.excited .in{animation:hop .32s ease-in-out infinite}
.mon.excited .mouth,.mon.eat .mouth{left:30%;right:30%;top:58%;height:24%;border-radius:999px}
.mon.eat .in{animation:chomp .35s}
.mon.shoot .body{animation:puff .14s}
.mon.shoot .mouth{left:34%;right:34%;top:60%;height:18%;border-radius:999px}
.mon.empty .eyes i{animation:none;scale:1 .14;background:#2a2f4a}
.mon.empty .eyes i::after{display:none}
.mon.empty .mouth{left:42%;right:42%;height:8%;border-radius:999px}
.mon.empty .in::after{content:"z";position:absolute;right:-12%;top:-28%;font-weight:700;font-size:.8rem;color:var(--muted);animation:zz 1.6s infinite}
@keyframes hop{50%{translate:0 -14%}}
@keyframes chomp{30%{scale:1.25 .8}60%{scale:.9 1.1}}
@keyframes puff{50%{scale:1.14 .9}}
@keyframes zz{0%{opacity:0;translate:0 4px}50%{opacity:1}100%{opacity:0;translate:4px -8px}}
/* çilek karakteri */
.mon.chr .in{width:108%;height:108%}
.chr .char{width:100%;height:100%;display:block;overflow:visible}
.chr .char .eyes-closed,.chr .char .mouth-open,.chr .char .mouth-o,.chr .char .zz,.chr .char .cheeks-puff{display:none}
.chr.excited .mouth-smile,.chr.eat .mouth-smile,.chr.shoot .mouth-smile,.chr.empty .mouth-smile{display:none}
.chr.excited .mouth-open,.chr.eat .mouth-open{display:inline}
.chr.shoot .mouth-o,.chr.shoot .cheeks-puff{display:inline}
.chr.shoot .cheeks{display:none}
.chr.empty .eyes-open{display:none}
.chr.empty .eyes-closed{display:inline}
.chr .eyes-open{animation:sblink 4s infinite;animation-delay:var(--dl);transform-origin:100px var(--ey,108px)}
.chr:not(.excited):not(.eat):not(.empty) .rig{animation:sbob 2.4s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes sblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sbob{50%{transform:translateY(-6px)}}
.beams{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15;overflow:visible}
.beams line{stroke-linecap:round}
.jar.shoot .in{animation:recoil .14s}
@keyframes recoil{50%{scale:1.12}}
.dot{position:fixed;width:9px;height:9px;margin:-4.5px;border-radius:50%;z-index:30;pointer-events:none}
.piece.shake{animation:shake .35s}
@keyframes shake{20%{translate:-4px 0}40%{translate:4px 0}60%{translate:-3px 0}80%{translate:2px 0}}
.hint{max-width:440px;text-align:center;color:var(--muted);font-weight:500;font-size:.9rem;line-height:1.35;margin:0}
.btnrow{display:flex;gap:10px;margin-top:8px;justify-content:center}
button.pill{font-family:var(--display);font-weight:600;font-size:1rem;border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:#fff;cursor:pointer}
button.pill.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px #bdb6a6}
.over{position:fixed;inset:0;background:rgba(42,47,74,.45);display:grid;place-items:center;z-index:20;padding-inline:16px}
.card{background:#fff;border-radius:24px;padding:24px;text-align:center;max-width:320px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.card h2{margin:12px 0 4px;font-size:1.6rem}
.card p{margin:0 0 16px;color:var(--muted)}
.card .easel{animation:show .6s cubic-bezier(.3,1.4,.5,1)}
.card .pic{width:min(240px,70vw)}
.hint{font-size:.78rem;line-height:1.3}
@keyframes show{from{scale:.4;rotate:-12deg;opacity:0}}
@media (prefers-reduced-motion:reduce){.px.on,.card .easel{animation:none}.piece.fly{transition-duration:.01s}}

/* booster shelf: same wood as the tray, glossy round buttons with a price tag */
.boosters{display:flex;justify-content:space-evenly;align-items:flex-start;gap:10px;width:min(100%,340px);margin-top:8px;
  padding:12px 16px 20px;border-radius:22px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 11px),linear-gradient(180deg,#e2a768,#c27f43 55%,#a8652f);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.18),0 6px 14px rgba(80,40,10,.25)}
.boost{position:relative;width:62px;height:62px;flex:none;border:0;padding:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,var(--hi) 0 22%,var(--b1) 50%,var(--b2) 100%);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.45),0 0 0 3px #fff,0 5px 0 3px #8a5228;transition:transform .1s}
.boost[data-b="hint"]{--hi:#fff3a8;--b1:#ffcf2e;--b2:#e89a00}
.boost[data-b="hammer"]{--hi:#ffc2ad;--b1:#ff7a59;--b2:#d9432a}
.boost[data-b="moves"]{--hi:#c9f5c0;--b1:#43c463;--b2:#23883e}
.boost:active{transform:translateY(3px)}
.boost:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.boost .ic{display:grid;place-items:center}
.boost .ic svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.boost .ic b{font-size:1.45rem;font-weight:700;color:#fff;-webkit-text-stroke:1.5px #1d5a2c;paint-order:stroke;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.boost .bname{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.boost .price{position:absolute;left:50%;bottom:-15px;translate:-50% 0;display:flex;align-items:center;gap:3px;white-space:nowrap;
  background:#fff;border-radius:999px;padding:2px 8px 2px 4px;font-family:var(--display);font-size:.8rem;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(80,40,10,.3)}
.boost.armed{animation:armed .9s ease-in-out infinite;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.45),0 0 0 3px #fff,0 0 0 7px #ffd24a,0 5px 0 7px #8a5228}
@keyframes armed{50%{transform:scale(1.07)}}
.boost.poor{filter:saturate(.35) brightness(.95)}
.coin{width:16px;height:16px;flex:none}
.coins{position:relative;display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:3px 26px 3px 3px;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.07),0 3px 0 #d8cdb8,0 4px 8px rgba(80,40,10,.12)}
.coins .plus{position:absolute;right:3px;top:50%;translate:0 -50%;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:1rem;line-height:1;color:#fff;background:linear-gradient(180deg,#7fe08f,#2fa84f);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.coins .coin{width:28px;height:28px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.15))}
.coins b{font-size:1.05rem;min-width:2.2em;text-align:center}
.coins.bump{animation:hit .3s}
.piece.hintme{animation:hintpulse .6s ease-in-out 4}
@keyframes hintpulse{50%{transform:scale(1.18);filter:drop-shadow(0 0 6px #ffd24a)}}
.toast{position:fixed;left:50%;bottom:120px;translate:-50% 0;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:40;pointer-events:none;animation:toast 1.8s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}12%,80%{opacity:1;transform:none}100%{opacity:0}}

/* ana sayfa */
.roundbtn.back{background:radial-gradient(circle at 35% 28%,#ffe3a3 0 20%,#ffb02e 55%,#e07f00);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 3px #fff,0 4px 0 3px #b06200}
.home{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:linear-gradient(180deg,#bfe6ff 0%,#dff4d2 45%,#f6e7c6 100%)}
.htop{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px}
.htop .lives{justify-self:start}.htop .hcoins{justify-self:end;border:0;font-family:var(--display);color:var(--ink);cursor:pointer}
.lives{position:relative;display:flex;align-items:center;gap:4px;border:0;cursor:pointer;font-family:var(--display);background:#fff;border-radius:999px;padding:3px 12px 3px 3px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.07),0 3px 0 #d8cdb8,0 4px 8px rgba(80,40,10,.12)}
.lives .heart{width:32px;height:32px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.15))}
.lives b{position:absolute;left:3px;top:3px;width:32px;height:30px;display:grid;place-items:center;color:#fff;font-size:.95rem;-webkit-text-stroke:3px #a3173a;paint-order:stroke}
.lives span{font-weight:700;font-size:.85rem;color:var(--ink);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.logo.mini{padding:4px 12px 6px;border-radius:14px;rotate:-2deg;flex-direction:row;gap:4px;align-items:baseline}
.logo.mini span{font-size:.95rem;-webkit-text-stroke:3px #6b3410}.logo.mini b{font-size:1.35rem;-webkit-text-stroke:4px #6b3410;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.hview{position:relative;flex:1;min-height:0}
.map{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.mapin{position:relative;width:100%;max-width:460px;margin:0 auto}
.trail{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border:0;border-radius:50%;cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.35rem;color:#fff;
  -webkit-text-stroke:4px rgba(0,0,0,.35);paint-order:stroke;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#ffe6a8 0 20%,#e2a768 55%,#a8652f);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.45),0 0 0 4px #fff,0 6px 0 4px #8a5228}
.node.locked{background:radial-gradient(circle at 35% 28%,#f2f2f2 0 20%,#c9c4bb 60%,#a59e92);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 0 0 4px #fff,0 6px 0 4px #8d867a;color:#fff}
.node.locked svg{width:24px;height:24px}
.node.hard:not(.locked){background:radial-gradient(circle at 35% 28%,#e3d2ff 0 20%,#8e5be8 60%,#5c33b0);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.4),0 0 0 4px #fff,0 6px 0 4px #4a2690}
.node.super:not(.locked){background:radial-gradient(circle at 35% 28%,#ffc2c2 0 20%,#e8455f 60%,#a8203a);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.4),0 0 0 4px #fff,0 6px 0 4px #7a1428}
.node.cur{width:76px;height:76px;margin:-38px 0 0 -38px;font-size:1.7rem;animation:nodepulse 1.4s ease-in-out infinite}
.node.cur:not(.hard):not(.super){background:radial-gradient(circle at 35% 28%,#c9f5c0 0 20%,#43c463 60%,#23883e);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.45),0 0 0 4px #fff,0 6px 0 4px #1d6b33,0 0 0 12px rgba(255,255,255,.35)}
@keyframes nodepulse{50%{transform:scale(1.07)}}
.node:focus-visible{outline:3px solid var(--ink);outline-offset:8px}
.nstars{position:absolute;left:50%;top:calc(100% + 6px);translate:-50% 0;display:flex;gap:1px}
.nstars svg{width:16px;height:16px;fill:#e2d8c4;stroke:#9a8a6a;stroke-width:1.5}
.nstars svg.on{fill:#ffcf2e;stroke:#c98a00}
.nstars svg:nth-child(2){translate:0 -3px}
.ntag{position:absolute;left:50%;bottom:calc(100% + 8px);translate:-50% 0;white-space:nowrap;font-size:.7rem;font-weight:700;color:#fff;padding:2px 8px;border-radius:999px;-webkit-text-stroke:0;letter-spacing:.04em}
.ntag.hard{background:#6a3cc0;box-shadow:0 2px 0 #4a2690}.ntag.super{background:#d9324d;box-shadow:0 2px 0 #7a1428}
.mapchar{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;pointer-events:none}
.mapchar .char{width:100%;height:100%}
.mapchar .rig{animation:sbob 2.6s ease-in-out infinite;animation-delay:var(--dl)}
.mapchar .eyes-closed,.mapchar .mouth-open,.mapchar .mouth-o,.mapchar .zz,.mapchar .cheeks-puff{display:none}
.mapme{position:absolute;width:70px;height:84px;margin:-70px 0 0 0;pointer-events:none;z-index:2}
.mapme .msvg{width:70px;height:82px}
.mapme .me-happy,.mapme .me-sad,.mapme .mbrow,.mapme .mm-open,.mapme .mm-worry,.mapme .mm-sad,.mapme .msweat{display:none}
.mapme .mrig{transform-origin:60px 136px;animation:mbob 1.6s ease-in-out infinite}
.mapdeco{position:absolute;border-radius:50%;pointer-events:none}
.home .hplay{position:absolute;left:50%;translate:-50% 0;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:4;padding:6px 40px 7px;animation:none}
.home .hplay b{font-size:1.5rem}
.home .hplay small{font-size:.85rem}
.home .hplay small .difftag{margin-left:6px}
.hnav{position:relative;z-index:5;display:flex;justify-content:space-around;gap:6px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 11px),linear-gradient(180deg,#e2a768,#c27f43 55%,#a8652f);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 -6px 14px rgba(80,40,10,.2);border-radius:22px 22px 0 0}
.hnav button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;font-family:var(--display);font-weight:700;color:#fff;
  font-size:.8rem;-webkit-text-stroke:3px #6b3410;paint-order:stroke;padding:4px 0;border-radius:14px}
.hnav button svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));transition:transform .15s}
.hnav button.on{background:rgba(255,255,255,.22)}
.hnav button.on svg{transform:translateY(-4px) scale(1.12)}
.hnav button:focus-visible{outline:3px solid #fff}
.tab{position:absolute;inset:0;overflow-y:auto;padding:4px 14px 120px}
.tabtitle{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
.tabtitle h2{margin:0;font-size:1.5rem;color:#fff;-webkit-text-stroke:5px #6b3410;paint-order:stroke}
.tabtitle span{font-weight:700;color:#8a5228}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gcard{background:#fbf6ec;border-radius:14px;padding:6px 6px 4px;box-shadow:0 0 0 3px #c98447,0 4px 0 3px #9a5c2c;text-align:center;border:0;font-family:var(--display);cursor:pointer}
.gcard .gpic{display:grid;grid-template-columns:repeat(16,1fr);aspect-ratio:1;border-radius:6px;overflow:hidden}
.gcard .gpic i{display:block}
.gcard b{display:block;font-size:.72rem;color:#8a5228;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard.locked .gpic{background:repeating-linear-gradient(45deg,#e8dfcf 0 6px,#efe7d8 6px 12px);display:grid;place-items:center}
.gcard.locked .gpic span{grid-column:1/-1;font-size:1.6rem;font-weight:700;color:#c8b898}
.demo{background:#fff6d6;border-radius:12px;padding:8px 12px;font-size:.8rem;font-weight:600;color:#8a5228;margin-bottom:12px;box-shadow:0 2px 0 #e8d9a8}
.shead{font-size:1rem;color:#8a5228;margin:16px 2px 8px;letter-spacing:.06em}
.packs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pack{position:relative;background:#fbf6ec;border-radius:18px;padding:14px 8px 10px;text-align:center;box-shadow:0 0 0 3px #c98447,0 5px 0 3px #9a5c2c;display:flex;flex-direction:column;align-items:center;gap:6px}
.pack .pile{height:52px;display:flex;align-items:flex-end;justify-content:center}
.pack .pile .coin{width:30px;height:30px;margin:0 -7px}
.pack .pile .coin:nth-child(2){translate:0 -8px}.pack .pile .coin:nth-child(4){translate:0 -14px}
.pack .amt{font-size:1.4rem;font-weight:700;color:#9a6a00}
.pack .ribbon{position:absolute;top:-10px;left:50%;translate:-50% 0;white-space:nowrap;font-size:.68rem;font-weight:700;color:#fff;padding:2px 9px;border-radius:999px;background:#e8455f;box-shadow:0 2px 0 #7a1428}
.pack .ribbon.best{background:#2fa84f;box-shadow:0 2px 0 #1d6b33}
.buybtn{border:0;cursor:pointer;font-family:var(--display);font-weight:700;color:#fff;font-size:1rem;padding:7px 14px 8px;border-radius:12px;width:100%;
  background:linear-gradient(180deg,#8ee89a,#34b356 55%,#23883e);-webkit-text-stroke:3px #1d5a2c;paint-order:stroke;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 3px 0 #1d6b33;display:flex;align-items:center;justify-content:center;gap:4px}
.buybtn .coin{width:18px;height:18px}
.buybtn:active{transform:translateY(2px)}
.buybtn.poor{filter:saturate(.3)}
.row{display:flex;align-items:center;gap:12px;background:#fbf6ec;border-radius:18px;padding:12px;box-shadow:0 0 0 3px #c98447,0 5px 0 3px #9a5c2c;margin-bottom:14px}
.row .ricon{width:52px;height:52px;flex:none;display:grid;place-items:center}
.row .ricon .heart{width:48px;height:48px}
.row .ricon .coin{width:44px;height:44px}
.row .rtext{flex:1;min-width:0}
.row .rtext b{display:block;font-size:1.05rem}
.row .rtext small{color:var(--muted);font-weight:600}
.row .buybtn{width:auto;flex:none}
.difftag{display:inline-block;font-size:.7rem;font-weight:700;color:#fff;padding:1px 8px;border-radius:999px;-webkit-text-stroke:0;letter-spacing:.04em;vertical-align:middle}
.difftag.hard{background:#6a3cc0;box-shadow:0 2px 0 #4a2690}.difftag.super{background:#d9324d;box-shadow:0 2px 0 #7a1428}.difftag.normal{background:#2fa84f;box-shadow:0 2px 0 #1d6b33}
.lvl .difftag{position:absolute;left:50%;top:calc(100% - 4px);translate:-50% 0;white-space:nowrap}
/* popups over the home screen */
.pop{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding-inline:16px;background:rgba(60,35,15,.55)}
.popin{position:relative;width:100%;max-width:330px}
.popin .endcard{margin-top:30px}
.closex{position:absolute;right:-8px;top:-8px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#ffc2ad 0 20%,#ff7a59 55%,#d9432a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 3px #fff,0 4px 0 3px #8a2a14}
.closex svg{width:18px;height:18px}
.qpic{display:grid;grid-template-columns:repeat(16,1fr);gap:1px;width:min(170px,48vw);aspect-ratio:1}
.qpic i{border-radius:2px;background:#e4dfd4;box-shadow:inset -1px -1.5px 0 rgba(0,0,0,.08),inset 1px 1px 0 rgba(255,255,255,.7)}
.qmark{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;font-weight:700;color:#c8b898;-webkit-text-stroke:0}
.infos{display:flex;gap:10px;justify-content:center}
.info{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 12px 4px 6px;box-shadow:0 3px 0 #d8cdb8;font-weight:700;font-size:.95rem}
.info svg{width:22px;height:22px}
.popnote{margin:0;font-size:.8rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px;justify-content:center}
.popnote .heart{width:16px;height:16px}
.timerbig{font-size:2rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.toast{z-index:70}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.9;padding:14px 34px 18px;border-radius:26px;color:#fff;rotate:-3deg;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 11px),linear-gradient(180deg,#e2a768,#c27f43 55%,#a8652f);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -6px 0 rgba(0,0,0,.18),0 10px 22px rgba(80,40,10,.3)}
.logo span{font-size:1.7rem;font-weight:700;-webkit-text-stroke:5px #6b3410;paint-order:stroke;letter-spacing:.04em}
.logo b{font-size:3.4rem;font-weight:700;color:#ffcf2e;-webkit-text-stroke:7px #6b3410;paint-order:stroke;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.playbtn{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;cursor:pointer;font-family:var(--display);color:#fff;
  padding:14px 56px 12px;border-radius:24px;background:linear-gradient(180deg,#8ee89a,#34b356 55%,#23883e);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.45),0 0 0 4px #fff,0 7px 0 4px #1d6b33,0 14px 22px rgba(30,90,40,.3);animation:breathe2 1.6s ease-in-out infinite}
.playbtn b{font-size:2.2rem;font-weight:700;-webkit-text-stroke:5px #1d5a2c;paint-order:stroke;letter-spacing:.06em}
.playbtn small{font-size:.95rem;font-weight:700;-webkit-text-stroke:3px #1d5a2c;paint-order:stroke}
.playbtn:active{transform:translateY(4px)}
.playbtn:focus-visible{outline:3px solid var(--ink);outline-offset:8px}
@keyframes breathe2{50%{scale:1.04}}
.homecoins{padding-right:12px}
@media (prefers-reduced-motion:reduce){.playbtn,.homecat svg{animation:none}}

/* ana karakter: ressam kaplumbağa, hamle tabelasını tutar */
.mascot{position:relative;width:118px;height:150px;flex:none}
.msvg{position:absolute;left:0;top:0;width:118px;height:138px;overflow:visible}
.mascot .moves{position:absolute;left:50%;bottom:0;translate:-50% 0;width:72px;height:72px;z-index:2;
  box-shadow:inset 0 -3px 0 rgba(150,90,30,.15),0 0 0 5px #c98447,0 0 0 7px #9a5c2c,0 6px 10px rgba(80,40,10,.28)}
.mascot .moves small{font-size:.5rem}
.mascot .moves b{font-size:1.85rem}
.mascot .moves.flip{animation:flip .45s ease-in-out}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(.95)}100%{transform:rotateY(0)}}
.mhand{position:absolute;bottom:26px;width:15px;height:15px;border-radius:50%;background:#9be07f;box-shadow:0 0 0 3px #2f6b2a;z-index:3}
.mhand.l{left:calc(50% - 44px)}.mhand.r{left:calc(50% + 29px)}
.mascot .me-happy,.mascot .me-sad,.mascot .mbrow,.mascot .mm-open,.mascot .mm-worry,.mascot .mm-sad,.mascot .msweat{display:none}
.mascot[data-mood="happy"] .me-open,.mascot[data-mood="cheer"] .me-open{display:none}
.mascot[data-mood="happy"] .me-happy,.mascot[data-mood="cheer"] .me-happy{display:inline}
.mascot[data-mood="happy"] .mm-smile,.mascot[data-mood="cheer"] .mm-smile{display:none}
.mascot[data-mood="happy"] .mm-open,.mascot[data-mood="cheer"] .mm-open{display:inline}
.mascot[data-mood="worried"] .mbrow,.mascot[data-mood="worried"] .msweat,.mascot[data-mood="worried"] .mm-worry{display:inline}
.mascot[data-mood="worried"] .mm-smile{display:none}
.mascot[data-mood="sad"] .me-open,.mascot[data-mood="sad"] .mm-smile{display:none}
.mascot[data-mood="sad"] .me-sad,.mascot[data-mood="sad"] .mm-sad{display:inline}
.mascot[data-mood="no"] .mbrow{display:inline}
.mascot[data-mood="no"] .mm-smile{display:none}.mascot[data-mood="no"] .mm-worry{display:inline}
.mascot .mrig{transform-origin:60px 136px;animation:mbob 2.6s ease-in-out infinite}
.mascot .me-open{animation:sblink 4.2s infinite;transform-origin:60px 60px}
.mascot .mpupils{transition:translate .2s}
.mascot[data-mood="idle"] .mpupils{animation:look 6s ease-in-out infinite}
@keyframes look{0%,40%{translate:0 0}50%,80%{translate:-2px 1px}90%{translate:1px -1px}}
.mascot[data-mood="happy"] .mrig{animation:mhop .45s ease-out}
.mascot[data-mood="cheer"] .mrig{animation:mcheer .55s ease-in-out 3}
.mascot[data-mood="worried"] .mrig{animation:mshiver .18s linear infinite}
.mascot[data-mood="sad"] .mrig{animation:none;transform:translateY(4px) scale(1,.96)}
.mascot[data-mood="no"] .mhead{animation:mno .45s ease-in-out;transform-origin:60px 80px}
.mascot .marm{transform-origin:76px 96px}
.mascot.paint .marm{animation:mpaint .35s ease-in-out}
@keyframes mbob{50%{transform:translateY(-3px)}}
@keyframes mhop{40%{transform:translateY(-12px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.04,.96)}}
@keyframes mcheer{30%{transform:translateY(-18px) rotate(-6deg)}60%{transform:translateY(-18px) rotate(6deg)}100%{transform:translateY(0)}}
@keyframes mshiver{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
@keyframes mno{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes mpaint{50%{transform:rotate(-28deg)}}
.mbubble{position:absolute;right:62%;top:-6px;z-index:20;background:#fff;color:var(--ink);font-weight:700;font-size:.85rem;white-space:nowrap;
  padding:6px 11px;border-radius:14px;box-shadow:0 3px 0 #d8cdb8,0 6px 12px rgba(80,40,10,.18);animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
.mbubble::after{content:"";position:absolute;right:-7px;top:12px;border:7px solid transparent;border-left-color:#fff;border-right:0}
@keyframes pop{from{scale:.4;opacity:0}}
@media (prefers-reduced-motion:reduce){.mascot *{animation:none!important}}

.mascot .moves .num{position:relative;display:block;height:1.9rem;width:100%;overflow:hidden}
.mascot .moves .num b{position:absolute;left:0;right:0;text-align:center;line-height:1.9rem;height:1.9rem}
.mascot .moves .num b.old{animation:rollout .45s ease-in .15s forwards}
.mascot .moves .num b.new{transform:translateY(-100%);animation:rollin .45s cubic-bezier(.3,1.5,.5,1) .3s forwards}
.mascot .moves .num b.new.fromdown{transform:translateY(100%)}
.mascot .moves .num b.old:has(+ .fromdown){animation-name:rollout-up}
@keyframes rollout{to{transform:translateY(100%);opacity:0}}
@keyframes rollout-up{to{transform:translateY(-100%);opacity:0}}
@keyframes rollin{to{transform:translateY(0)}}
/* sign + hands lift together while the number changes */
.mascot.lift .moves,.mascot.liftup .moves{animation:signlift .75s ease-in-out}
.mascot.lift .mhand,.mascot.liftup .mhand{animation:handlift .75s ease-in-out}
@keyframes signlift{0%{translate:-50% 0}30%{translate:-50% -14px;rotate:-6deg}55%{translate:-50% -14px;rotate:6deg}100%{translate:-50% 0;rotate:0deg}}
@keyframes handlift{0%{translate:0 0}30%,55%{translate:0 -14px}100%{translate:0 0}}
.mascot.lift .mpupils,.mascot.liftup .mpupils{translate:0 3px}
.mascot.liftup .mrig{animation:mhop .5s ease-out}
.delta{position:absolute;right:-6px;bottom:58px;z-index:6;font-weight:700;font-size:1.25rem;pointer-events:none;
  -webkit-text-stroke:4px #fff;paint-order:stroke;animation:deltaup 1.1s ease-out forwards}
.delta.minus{color:#e8455f}.delta.plus{color:#2fa84f;font-size:1.5rem}
@keyframes deltaup{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-34px)}}

/* brush writes on the sign */
.mbrush{position:absolute;left:0;top:0;width:16px;height:54px;z-index:7;pointer-events:none;transform-origin:50% 100%;display:none}
.mbrush svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.mascot.writing .mbrush{display:block}
.mascot.writing .marm{opacity:0}
.mascot.writing .mpupils{translate:-1px 3px}
.mascot .moves .num b.old{transform:none;animation:wipe .24s ease-in .19s forwards}
.mascot .moves .num b.new{transform:none;clip-path:inset(0 100% 0 0);animation:write .27s linear .49s forwards}
@keyframes wipe{to{opacity:0;filter:blur(2px);transform:translateX(8px) scaleX(1.25)}}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.mascot .moves .smear{position:absolute;left:16%;top:50%;height:12px;width:0;border-radius:8px;background:var(--paint,#ef3d55);opacity:.55;
  animation:smear .24s ease-out .19s forwards,smearfade .35s ease .5s forwards}
@keyframes smear{to{width:68%}}
@keyframes smearfade{to{opacity:0}}
.mascot .moves{overflow:visible}

/* bitiş ekranları */
.over{background:radial-gradient(circle at 50% 40%,rgba(255,240,210,.55),rgba(60,35,15,.6));overflow:hidden}
.card{background:none;box-shadow:none;padding:0;max-width:340px}
.endcard{position:relative;margin-top:26px;padding:40px 18px 20px;border-radius:26px;background:#fbf6ec;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 0 0 6px #c98447,0 0 0 9px #9a5c2c,0 18px 40px rgba(40,20,5,.45);animation:cardin .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes cardin{from{transform:translateY(40px) scale(.85);opacity:0}}
.banner{position:absolute;top:-30px;left:50%;translate:-50% 0;white-space:nowrap;padding:8px 30px 10px;border-radius:16px;color:#fff;
  font-size:1.9rem;font-weight:700;letter-spacing:.04em;-webkit-text-stroke:6px #6b3410;paint-order:stroke;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 11px),linear-gradient(180deg,#e2a768,#c27f43 55%,#a8652f);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.18),0 6px 14px rgba(80,40,10,.3)}
.banner.red{font-size:1.5rem;-webkit-text-stroke:6px #7a1f2e;background:linear-gradient(180deg,#ff8a8a,#e8455f 55%,#b8283f)}
.starrow{display:flex;gap:6px;align-items:flex-end;margin-top:-4px}
.star svg{width:46px;height:46px;fill:#e2d8c4;stroke:#b8a888;stroke-width:1.6}
.star:nth-child(2) svg{width:58px;height:58px}
.star.on{animation:starin .45s cubic-bezier(.3,1.8,.5,1) both}

.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;width:100%}
.bgrid>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.bgrid b{font-size:.72rem;color:#6b3410;line-height:1.1}
.boost.mid{width:46px;height:46px;display:grid;cursor:default}
.boost.mid .ic svg{width:26px;height:26px}.boost.mid .ic b{font-size:1.1rem}

/* Kuby'nin elleri: paletin içinde, kenarı kavrar; ekran ne olursa olsun yerinden kaymaz */
.mascot .palette{width:124px;padding:0 13px}
.palette .mhand{position:absolute;top:50%;width:22px;height:26px;margin-top:-13px;border-radius:0;background:none;box-shadow:none;bottom:auto;z-index:3;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(60,30,5,.25))}
.palette .mhand svg{width:100%;height:100%;display:block}
.palette .mhand.l{left:-12px}
.palette .mhand.r{left:auto;right:-12px;transform:scaleX(-1)}

/* kenarlarda hava fırçaları */
.jar.ab .in{width:68%;height:92%;transition:scale .18s ease-out}
.jar.ab svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 2px rgba(60,30,5,.3))}
.jar.ab.excited .in{animation:abshake .12s linear infinite}
@keyframes abshake{25%{translate:-1px 0}75%{translate:1px 0}}
.jar.ab.eat .in{animation:abgulp .35s ease-out}
@keyframes abgulp{40%{scale:1.15 .9}}
.jar.ab.shoot .in{animation:abpuff .14s}
@keyframes abpuff{50%{translate:0 2px;scale:1 .95}}
.spr{position:fixed;border-radius:50%;pointer-events:none;z-index:24}
.px.soft{animation:pxsoft .45s ease-out}
@keyframes pxsoft{0%{opacity:.25;filter:blur(1.5px)}}

.jar.ab.spraying .in{animation:abspray .1s linear infinite;filter:drop-shadow(0 0 6px rgba(255,255,255,.9));scale:1.4}
@keyframes abspray{0%{translate:0 -3px}50%{translate:-1px -4px}100%{translate:1px -3px}}
.jar.ab.spraying{z-index:6}

/* raf Kuby'nin altında, sol üstte menü */
.lbtns{display:flex;gap:8px;align-items:center;justify-self:start}
.roundbtn.gmenu{width:40px;height:40px;background:radial-gradient(circle at 35% 28%,#d9c2ff 0 20%,#8e5be8 60%,#5c33b0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 3px #fff,0 4px 0 3px #4a2690}
.roundbtn.gmenu svg{width:20px;height:20px}
.side{gap:8px}
.side-rack{margin-top:0;width:124px;box-sizing:border-box;flex-wrap:wrap;justify-content:center;gap:3px;padding:5px 5px 7px}
.side-rack .rlabel{width:100%;flex-direction:row;justify-content:center;gap:5px;margin:0 0 1px}
.side-rack .rlabel b{font-size:.85rem}
.side-rack .slot{width:24px;height:24px;border-radius:7px}
.side-rack .slot svg{width:23px;height:23px}

.rackwait{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;width:124px;margin-top:-2px;padding:4px 5px 5px;box-sizing:border-box;border-radius:12px;
  background:rgba(232,69,95,.12);box-shadow:inset 0 0 0 2px rgba(232,69,95,.45)}
.rackwait em{width:100%;text-align:center;font-style:normal;font-weight:700;font-size:.62rem;color:#b8283f;letter-spacing:.03em}
.rackwait .slot{width:22px;height:22px;border-radius:7px}
.rackwait .slot svg{width:21px;height:21px}
.rackwait .slot .xmark{width:13px;height:13px;font-size:.5rem;right:-4px;top:-5px}
.side{position:relative}
.rackwait{position:absolute;left:50%;top:calc(100% + 2px);translate:-50% 0;z-index:7;background:#fff0f2;box-shadow:inset 0 0 0 2px rgba(232,69,95,.55),0 4px 10px rgba(80,20,30,.2)}

.jar.ab.excited .in,.jar.ab.eat .in{scale:1.25}
.jar.ab.excited,.jar.ab.eat{z-index:6}
/* paletteki renkler hep yuvarlak kalsın: boyut sabit, animasyonlar yalnızca eşit ölçekle */
.mascot .palette .pwell{width:30px;height:30px;min-width:30px;max-width:30px;aspect-ratio:1;flex:0 0 30px;scale:none}
.mascot .palette .pwell.wnew{animation:wpop .45s cubic-bezier(.3,1.6,.5,1)}
.mascot .palette .pwell.hit{animation:whit .3s ease-out}
.mascot .palette .pwell.done{animation:wdone .45s ease-in forwards}
@keyframes wpop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes whit{50%{transform:scale(1.18)}}
@keyframes wdone{40%{transform:scale(1.25)}100%{transform:scale(0);opacity:.2}}

/* performans: pahalı filtreler kalktı, hareket eden şeyler kendi katmanında */
.piece svg{filter:none}
.jar.ab svg{filter:none}
.jar.ab.spraying .in{filter:none}
.px.soft{animation:pxsoft2 .4s ease-out}
@keyframes pxsoft2{0%{opacity:.3}}
.piece.fly,.minicat,.spr,.jar.ab .in{will-change:transform}
.spr.puff{background:radial-gradient(circle,var(--c) 0 35%,transparent 70%)}

.piece,.jar,.rock{contain:layout style}
.pic .px{contain:layout style}

.cone{position:fixed;height:26px;margin-top:-13px;transform-origin:0 50%;clip-path:polygon(0 50%,100% 0,100% 100%);pointer-events:none;z-index:23;opacity:0;will-change:opacity}
/* Kuby'nin boşta animasyonları SVG içini her karede yeniden çizdiriyordu: bobu dış kaba taşı, göz gezdirmeyi kapat */
.mascot[data-mood="idle"] .mrig,.mascot[data-mood="worried"] .mrig{animation:none}
.mascot[data-mood="idle"] .msvg{animation:kbob 2.6s ease-in-out infinite;will-change:transform}
@keyframes kbob{50%{transform:translateY(-3px)}}
.mascot[data-mood="idle"] .mpupils{animation:none}
.mascot .me-open{animation-timing-function:steps(1,end)}
.piece .zz{animation:none}
.piece,.rock{will-change:transform}
.board{contain:layout style}

.coach{position:fixed;z-index:43;transform:translate(-50%,0);width:max-content;max-width:min(320px,86vw);background:#2a2f4a;color:#fff;border-radius:14px;padding:7px 12px 9px;
  font-weight:600;font-size:.88rem;line-height:1.3;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.25);pointer-events:none;animation:coachin .35s cubic-bezier(.3,1.5,.5,1)}
.coach b{display:block;color:#9be07f;font-size:.66rem;letter-spacing:.1em}
.coach::after{display:none;content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#2a2f4a;transform:translateX(-50%) rotate(45deg)}
@keyframes coachin{from{opacity:0;transform:translate(-50%,12px) scale(.9)}}
.coach{font-size:.95rem;padding:10px 14px 12px}

/* logo: Kuby: Paint Puzzle */
.logo.mini{flex-direction:column;align-items:center;gap:0;padding:3px 12px 5px;line-height:1}
.logo.mini span{font-size:.8rem;letter-spacing:.12em}

@keyframes tfloat{50%{translate:0 -10px}}
.hubin{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:-10px}

.tplay{font-size:2rem;padding:12px 64px 14px;animation:nodepulse 1.4s ease-in-out infinite}
.tplay small{font-size:1rem}
.tplay:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
@media (max-height:680px){.tkuby,.tkuby .msvg{width:140px;height:155px}}

// ===== çekirdek kurallar (bölüm üreticiyle birebir aynı) =====
const CORE=(function(){// ===== Kuby: Paint Puzzle çekirdek kuralları (oyunda ve bölüm üreticide aynen kullanılır) =====
// Tüp: {id, cells:[[r,c]...] kuyruktan kafaya, d:'up'|'down'|'left'|'right', key: renk harfi,
//   x:'J' gökkuşağı | 'C' bukalemun (cols:[a,b]), hid, ice(0-2), lock(id), keyId(id), sleep, timer}
// Tahta: {ps:[...tüpler], t: oyuncu dokunuş sayısı}
let W=7;let ROCKS=new Set();
const VEC={up:[-1,0],right:[0,1],down:[1,0],left:[0,-1]};
const headOf=p=>p.cells[p.cells.length-1];
const laneOf=p=>{const[r,c]=headOf(p);return p.d==='up'?'top:'+c:p.d==='down'?'bottom:'+c:p.d==='left'?'left:'+r:'right:'+r};
function occMap(ps){const m=new Map();for(const q of ps)for(const[r,c]of q.cells)m.set(r*W+c,q);return m}
function pathClear(p,occ){const[dr,dc]=VEC[p.d];
  for(const[r0,c0]of p.cells){let r=r0+dr,c=c0+dc;
    while(r>=0&&r<W&&c>=0&&c<W){const k=r*W+c;if(ROCKS.has(k))return false;const o=occ.get(k);if(o&&o!==p)return false;r+=dr;c+=dc}}
  return true}
const isLocked=(p,ps)=>p.lock!=null&&ps.some(q=>q.keyId===p.lock);
function launchable(p,ps,occ){return !(p.ice>0)&&!isLocked(p,ps)&&pathClear(p,occ)}
function freeSet(B){const occ=occMap(B.ps),s=new Set();for(const q of B.ps)if(launchable(q,B.ps,occ))s.add(q);return s}
function touching(a,b){for(const[r,c]of a.cells)for(const[r2,c2]of b.cells)if(Math.abs(r-r2)+Math.abs(c-c2)===1)return true;return false}
// renk: bukalemun her dokunuşta iki rengi arasında gidip gelir
const keyAt=(p,t)=>p.x==='C'?p.cols[t%2]:p.x==='J'?'J':p.key;
function removePiece(B,p){B.ps.splice(B.ps.indexOf(p),1);
  for(const q of B.ps)if(q.ice>0&&touching(q,p))q.ice--}
function chainFrom(B,start,seq,before){const queue=start.slice();
  while(queue.length){const{p,how}=queue.shift();if(!B.ps.includes(p))continue;
    const key=keyAt(p,B.t);removePiece(B,p);seq.push({p,how,key});
    const now=freeSet(B);for(const q of now)if(!before.has(q)&&!q.sleep){before.add(q);queue.push({p:q,how:'go'})}
    for(const q of now)before.add(q)}}
// bir oyuncu hamlesi: tüp gider, zincir çalışır; sonra saat ilerler (bukalemun renk değiştirir, sabırsızın sayacı azalır)
function turn(B,x,how='go',tick=true){const seq=[];const before=freeSet(B);before.delete(x);
  chainFrom(B,[{p:x,how}],seq,before);
  if(tick){const pre=freeSet(B);B.t++;const jumpers=[];
    for(const q of B.ps)if(q.timer>0){q.timer--;if(q.timer===0)jumpers.push(q)}
    const start=jumpers.map(q=>({p:q,how:'jump'}));
    for(const q of freeSet(B))if(!pre.has(q)&&!q.sleep&&!jumpers.includes(q)){pre.add(q);start.push({p:q,how:'go'})}
    if(start.length)chainFrom(B,start,seq,pre)}
  return seq}
// kaya kırılınca da zincir çalışır
function breakRock(B,k){const before=freeSet(B);ROCKS.delete(k);const seq=[];const start=[];
  for(const q of freeSet(B))if(!before.has(q)&&!q.sleep){before.add(q);start.push({p:q,how:'go'})}
  if(start.length)chainFrom(B,start,seq,before);return seq}
function cloneBoard(B){const map=new Map();const ps=B.ps.map(p=>{const q={...p};map.set(p,q);return q});return{B:{ps,t:B.t},map}}

// ===== siparişler ve raf =====
// O: {t:[{key,left}], win, rack:[key], peak}
function oNew(tasks,win){return{t:tasks.map(x=>({key:x.key,left:x.need??x.left})),win,rack:[],peak:0}}
function oClone(O){return{t:O.t.map(x=>({...x})),win:O.win,rack:O.rack.slice(),peak:O.peak}}
function oActive(O){const a=[];for(let i=0;i<O.t.length&&a.length<O.win;i++)if(O.t[i].left>0)a.push(i);return a}
function oSettle(O){let moved=true;while(moved){moved=false;
  for(const i of oActive(O)){const k=O.t[i].key;for(let j=0;j<O.rack.length&&O.t[i].left>0;j++)if(O.rack[j]===k){O.rack.splice(j,1);j--;O.t[i].left--;moved=true}}}}
// varış: normal tüp kendi siparişine ya da rafa; gökkuşağı ilk açık siparişe; bukalemun o anki rengiyle.
// gökkuşağı ve bukalemun sayılmayan "ekstra" tüplerdır: denge için sona 1'lik sipariş eklenir.
function oArrive(O,key,extra){
  if(key==='J'){const a=oActive(O);if(!a.length)return'none';const i=a[0];O.t[i].left--;O.t.push({key:O.t[i].key,left:1});oSettle(O);return'served'}
  if(extra)O.t.push({key,left:1});
  const i=oActive(O).find(i=>O.t[i].key===key);
  if(i!==undefined){O.t[i].left--;oSettle(O);return'served'}
  O.rack.push(key);O.peak=Math.max(O.peak,O.rack.length);return'rack'}
const isExtra=p=>p.x==='J'||p.x==='C';

// ===== simülasyon oyuncuları =====
function simStep(B,O,p,how){const seq=turn(B,p,how);for(const e of seq)oArrive(O,e.key,isExtra(e.p));return seq}
function scoreMove(B,O,p){const{B:B2,map}=cloneBoard(B);const O2=oClone(O);simStep(B2,O2,map.get(p));
  // raf boşken iyi; yeni açılan tüp sayısı az bonus
  return O2.rack.length*10+(O2.peak>O.peak?6:0)-B2.ps.length*0.01}
function greedyPick(B,O){let best=1e9,pick=null;const fr=[...freeSet(B)];for(const f of fr){const s=scoreMove(B,O,f);if(s<best){best=s;pick=f}}return pick}
// oyun: 'greedy' = düşünen oyuncu, 'noisy' = bazen hata yapan, 'rand' = rastgele
function playLevel(L,policy,rng,limit){ROCKS=new Set(L.rocks||[]);W=L.W||7;
  const B={ps:L.p.map(clonePiece),t:0};const O=oNew(L.t,L.win);let steps=0;

    <rect x="11" y="-15" width="24" height="30" rx="6" fill="${fill}" stroke="${dark}" stroke-width="3.5"/><path d="M17.5 -11 V11 M23 -11 V11 M28.5 -11 V11" stroke="${dark}" stroke-width="2.2" opacity=".5"/><path d="M14 -9.5 H32" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".6"/></g>`;

    if(segLen){const a=P[P.length-2],b=P[P.length-1],m=[(a[0]+b[0])/2,(a[1]+b[1])/2],ang=d==='left'?0:hd;
      g+=`<g transform="translate(${m[0].toFixed(1)} ${m[1].toFixed(1)}) rotate(${ang})"><rect x="-38" y="-12" width="76" height="24" rx="12" fill="#fff" opacity=".94"/><text x="0" y="7.5" text-anchor="middle" font-family="Fredoka,ui-rounded,system-ui,sans-serif" font-size="21" font-weight="700" fill="${v.rainbow?'#6a3cc0':dark}" letter-spacing=".5">Kuby</text></g>`}

function renderBoosts(){const el=document.getElementById('boosters');if(!el)return;
  el.innerHTML=BOOSTS.map(b=>{const locked=levelNo<b.lv,n=inv[b.id]||0;
    return `<button class="boost ${locked?'locked':''} ${armed===b.id?'armed':''} ${!locked&&!n&&coins<b.cost?'poor':''}" data-b="${b.id}" aria-label="${b.name}${locked?', bölüm '+b.lv+' ile açılır':n?', '+n+' tane':', '+b.cost+' altın'}">

function updCoins(bump){const el=document.getElementById('coins');el.textContent=coins;renderBoosts();

function setArmed(a){armed=a;board.classList.toggle('hammering',a==='hammer');document.querySelectorAll('.boost').forEach(b=>b.classList.toggle('armed',b.dataset.b===a))}
function payBoost(id){if((inv[id]||0)>0){inv[id]--;saveInv()}else{coins-=COST[id];saveCoins();updCoins(true)}sfx('boost');renderBoosts()}
function bestMove(){const act=wells.filter(x=>x!==null&&tasks[x].left>0).sort((a,b)=>a-b),rest=[];
  for(let i=nextTask;i<tasks.length;i++)if(tasks[i].left>0&&!act.includes(i))rest.push(i);
  const O={t:[...act,...rest].map(i=>({key:tasks[i].key,left:tasks[i].left})),win:wells.length,rack:rack.map(e=>e.key),peak:rack.length};
  return CORE.greedyPick(B,O)}
function unblock(fn){const pre=CORE.freeSet(B);fn();const start=[];for(const q of CORE.freeSet(B))if(!pre.has(q)&&!q.sleep){pre.add(q);start.push({p:q,how:'go'})}
  const seq=[];if(start.length)CORE.chainFrom(B,start,seq,pre);return seq}
function bonk(el){const r=el.getBoundingClientRect(),h=document.createElement('div');h.className='bonk';h.innerHTML=B_ICON.hammer;
  h.style.left=r.left+r.width/2+'px';h.style.top=r.top+r.height/2+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),600);sfx('hammer');vibe(50)}
function hammerOn(p){setArmed(null);if(isIdle())undoSnap=snapshot();bonk(p.el);let seq;
  if(p.ice>0){seq=unblock(()=>{p.ice=0});say('Buz kırıldı!',1100)}
  else if(p.lock!=null&&CORE.isLocked(p,B.ps)){seq=unblock(()=>{p.lock=null});say('Kilit kırıldı!',1100)}
  else{seq=CORE.turn(B,p,'jump',false);say('Hop! Gönderdim',1100)}
  payBoost('hammer');inLevelMoves++;setTimeout(()=>{playSeq(seq);refreshPieces()},250)}
function tapRock(k){if(ended)return;const el=board.querySelector(`.rock[data-k="${k}"]`);
  if(armed!=='hammer'){if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}sfx('nope');say('Kaya! Çekiçle kırılır',1300);return}
  setArmed(null);if(isIdle())undoSnap=snapshot();bonk(el);
  const seq=CORE.breakRock(B,k);payBoost('hammer');inLevelMoves++;
  if(el){el.classList.add('smash');setTimeout(()=>el.remove(),450)}say('Kaya paramparça!',1200);
  setTimeout(()=>{playSeq(seq);refreshPieces()},250)}
function useBoost(id){const b=BOOST[id];clearFinger();
  if(levelNo<b.lv){toast(`${b.name}, Bölüm ${b.lv}'de açılır`);return}
  if(ended)return;
  if(armed===id){setArmed(null);toast('Çekiç bırakıldı');return}
  if(!(inv[id]>0)&&coins<b.cost){toast('Yeterli altının yok');return}
  if(id==='hint'){const f=bestMove();if(!f){toast('Şu an gönderilecek tüp yok');return}
    f.el.classList.remove('hintme');void f.el.offsetWidth;f.el.classList.add('hintme');say('Bence bunu gönder!',1400)}
  else if(id==='undo'){if(!undoSnap){toast('Geri alınacak hamle yok');return}if(!isIdle()){toast('Tüpler yerine varsın, sonra dene');return}
    restore(undoSnap);undoSnap=null;mood('happy',800);say('Geri aldım!',1200)}
  else if(id==='mag'){const hs=B.ps.filter(p=>p.hid&&!p.rev);if(!hs.length){toast('Gizli tüp yok');return}
    hs.forEach(p=>p.rev=1);refreshPieces();say('Hepsi göründü!',1200)}
  else if(id==='brush'){if(!rack.length){toast('Raf zaten boş');return}
    const id2=runId,list=rack.splice(0);
    list.forEach((e,k)=>{const ti=tasks.findIndex(t=>t.key===e.key&&t.left>0);if(ti>=0)tasks[ti].left--;setTimeout(()=>{if(id2===runId)flyHome(e,id2)},k*120)});
    renderRack();renderPalette();checkWells();mood('cheer',1500);say('Sihirli fırça!')}
  else if(id==='slot'){if(rackSize>=MAXR){toast('Raf en fazla '+MAXR+' yuva olabilir');return}rackSize++;renderRack();mood('happy',900);say('Rafa yeni yuva!',1200)}
  else if(id==='hammer'){setArmed('hammer');toast('Kaya, buz, kilit ya da bir tüpe dokun');return}
  else if(id==='done'){if(!isIdle()){toast('Tüpler yerine varsın, sonra dene');return}
    const ws=wells.filter(ti=>ti!==null&&tasks[ti].left>0).sort((a,b)=>tasks[a].left-tasks[b].left||a-b);
    let ti=ws.find(ti=>B.ps.some(p=>isReg(p)&&p.key===tasks[ti].key));if(ti===undefined){toast('Tahtada bu renklerden tüp kalmadı');return}
    const k=tasks[ti].key,occ=CORE.occMap(B.ps);undoSnap=snapshot();
    const cand=B.ps.filter(p=>isReg(p)&&p.key===k).sort((a,b)=>(CORE.launchable(b,B.ps,occ)?1:0)-(CORE.launchable(a,B.ps,occ)?1:0)).slice(0,tasks[ti].left);
    const pre=CORE.freeSet(B),seq=[];cand.forEach(p=>{CORE.removePiece(B,p);seq.push({p,how:'jump',key:k})});
    const st=[];for(const q of CORE.freeSet(B))if(!pre.has(q)&&!q.sleep){pre.add(q);st.push({p:q,how:'go'})}if(st.length)CORE.chainFrom(B,st,seq,pre);
    playSeq(seq);refreshPieces();mood('cheer',1200);say('Sipariş geliyor!',1200)}
  else if(id==='shuffle'){const fut=tasks.slice(nextTask).filter(t=>t.left>0);if(fut.length<2){toast('Sırada karıştırılacak sipariş yok');return}
    const want={};rack.forEach(e=>want[e.key]=(want[e.key]||0)+1);
    const arr=fut.map(t=>({t,s:(want[t.key]||0)*10+Math.random()*9})).sort((a,b)=>b.s-a.s).map(x=>x.t);
    tasks.splice(nextTask,tasks.length-nextTask,...arr);say(rack.length?'Raftakiler öne alındı!':'Siparişler karıştı!',1300);mood('happy',800)}
  payBoost(id)}

    <button class="bigbtn green" id="stk1">ÇEKİÇ KULLAN</button><div class="endbtns"><button class="bigbtn orange" id="stk2">BAŞTAN BAŞLA</button></div></div>`);
  document.getElementById('stk1').onclick=()=>{closePop();if(levelNo<BOOST.hammer.lv)inv.hammer=(inv.hammer||0)+1,saveInv();
    if(!(inv.hammer>0)&&coins<COST.hammer){toast('Yeterli altının yok');stuckShown=false;return}setArmed('hammer');stuckShown=false;toast('Kırmak istediğin yere dokun')};
  document.getElementById('stk2').onclick=()=>{closePop();start(saved)}}

function demoView(f){const base={hidden:false,rainbow:false,color:'#43c463',sleep:false,ice:0,lock:null,keyId:null,timer:0,cham:null};
  if(f==='hid')return[[[0,0],[0,1]],'right',{...base,hidden:true,color:HIDDEN}];
  if(f==='bent')return[[[1,0],[1,1],[0,1]],'up',{...base,color:'#ff9324'}];
  if(f==='ice')return[[[0,0],[0,1]],'right',{...base,color:'#4cc3f0',ice:2}];
  if(f==='lock')return[[[0,0],[0,1]],'right',{...base,color:'#ef3d55',lock:1}];
  if(f==='sleep')return[[[0,0],[0,1]],'right',{...base,color:'#8e5be8',sleep:true}];
  if(f==='cham')return[[[0,0],[0,1]],'right',{...base,color:'#43c463',cham:['#43c463','#ff86b4']}];
  if(f==='timer')return[[[0,0],[0,1]],'right',{...base,color:'#ffcf2e',timer:3}];
  if(f==='joker')return[[[0,0],[0,1]],'right',{...base,rainbow:true,color:'#ffcf2e'}];
  return[[[0,0],[0,1]],'right',base]}
let seen={};try{seen=JSON.parse(localStorage.getItem('tirtil-seen')||'{}')||{}}catch(e){}

function featTarget(f){const ps=B.ps;
  if(f==='rock')return board.querySelector('.rock');
  const p=f==='hid'?ps.find(p=>p.hid&&!p.rev):f==='bent'?ps.find(p=>p.cells.length===3&&p.cells[0][0]!==p.cells[2][0]&&p.cells[0][1]!==p.cells[2][1]):f==='ice'?ps.find(p=>p.ice>0):
    f==='lock'?ps.find(p=>p.lock!=null):f==='sleep'?ps.find(p=>p.sleep):f==='cham'?ps.find(p=>p.x==='C'):f==='timer'?ps.find(p=>p.timer>0):f==='joker'?ps.find(p=>p.x==='J'):null;
  return p?p.el:null}
const FINGER='<svg viewBox="0 0 48 56"><path d="M17 30V8a4 4 0 0 1 8 0v16l11 2.4c3 .7 5 3.5 4.6 6.6L39 46c-.4 3-3 5-6 5H22c-2.2 0-4.2-1.2-5.2-3.2L10 35c-1.2-2.2.5-4.8 3-4.6Z" fill="#fff" stroke="#2a2f4a" stroke-width="3" stroke-linejoin="round"/><path d="M25 24v8M31 25.5V33" stroke="#2a2f4a" stroke-width="2.4" stroke-linecap="round"/></svg>';
function pointAt(el,text,keep){clearFinger();if(!el)return;el.scrollIntoView&&el.closest('.boosters')&&el.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  setTimeout(()=>{const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='finger';f.innerHTML=FINGER+(text?`<span>${text}</span>`:'');
    f.style.left=r.left+r.width/2+'px';f.style.top=r.top+r.height/2+'px';document.body.appendChild(f);
    el.classList.add('spot');f._el=el;if(!keep)setTimeout(()=>{if(f.isConnected)clearFinger()},6000)},350)}
function clearFinger(){document.querySelectorAll('.finger').forEach(f=>{if(f._el)f._el.classList.remove('spot');f.remove()})}

    sfx('order');document.getElementById('nok').onclick=()=>{closePop();next()};return}
  if(item.startsWith('b:')){const b=BOOST[item.slice(2)];
    popup(`<div class="endcard"><div class="banner">YENİ GÜÇ!</div><div class="newbig boost" data-b="${b.id}"><span class="ic">${B_ICON[b.id]}</span></div>
      <h3 class="newt">${b.name}</h3><p class="endtxt">${b.desc}</p><div class="gift">2 tane hediye!</div><button class="bigbtn green" id="nok">ANLADIM</button></div>`);
    sfx('order');document.getElementById('nok').onclick=()=>{closePop();pointAt(document.querySelector(`#boosters .boost[data-b="${b.id}"]`),'Buradan kullan');next()};return}
  const fi=FEAT_INFO[item],[cells,d,v]=demoView(item);
  popup(`<div class="endcard"><div class="banner ${item==='boss'?'red':''}">${item==='boss'?'BOSS!':'YENİ!'}</div>
    <div class="newbig ${item==='boss'?'bossart':''}">${item==='boss'?'<b>8×8</b>':item==='rock'?ROCK_SVG:catSVG(cells,d,v)}</div>
    <h3 class="newt">${fi.t}</h3><p class="endtxt">${fi.d}</p><button class="bigbtn green" id="nok">ANLADIM</button></div>`);
  sfx('newcolor');document.getElementById('nok').onclick=()=>{closePop();if(item!=='boss')pointAt(featTarget(item),item==='rock'?'Kaya':'Bu!');next()}}
function levelIntro(){const items=[],f=FEAT_AT[levelNo];
  if(isBoss(levelNo)&&!seen['boss'+levelNo]){seen['boss'+levelNo]=1;items.push('boss')}
  if(f&&!seen[f]){seen[f]=1;items.push(f)}
  const nb=[];BOOSTS.forEach(b=>{if(levelNo>=b.lv&&!gifts[b.id]){gifts[b.id]=1;inv[b.id]=(inv[b.id]||0)+2;nb.push(b.id)}});
  if(nb.length===1)items.push('b:'+nb[0]);else if(nb.length)items.push('bs:'+nb.join(','));
  saveSeen();saveInv();renderBoosts();
  const tutNext=()=>{if(levelNo<=4&&!seen['tut'+levelNo])setTimeout(()=>startTutorial(levelNo),500)};
  const run=()=>{if(!items.length){tutNext();return}const it=items.shift();setTimeout(()=>introCard(it,run),items.length?250:0)};
  if(items.length)setTimeout(run,450);else tutNext()}

function coach(text,target){document.querySelectorAll('.coach').forEach(x=>x.remove());const c=document.createElement('div');c.className='coach';c.innerHTML=`<b>KUBY</b>${text}`;document.body.appendChild(c);
  const pr=document.querySelector('.top .easel').getBoundingClientRect();c.style.left=(pr.left+pr.width/2)+'px';c.style.top=(pr.top+pr.height*.18)+'px';c.style.maxWidth=Math.max(180,pr.width-16)+'px';if(target)pointAt(target,null,true)}
function clearCoach(){document.querySelectorAll('.coach').forEach(x=>x.remove());clearFinger()}
function freeNow(){const occ=CORE.occMap(B.ps);return B.ps.filter(p=>isReg(p)&&CORE.launchable(p,B.ps,occ))}
function startTutorial(n){if(ended||levelNo!==n)return;const id=runId;const done=()=>{tutLock=null;tut=null;seen['tut'+n]=1;saveSeen()};
  if(n===1){const f=bestMove();if(!f)return done();tutLock=f;
    coach('Önü boş tüpe dokun. Kendi rengindeki fırçaya gider ve resmi boyar!',f.el);

    const cb=num('--bw');if(cb<=180)break;root.style.setProperty('--bw',Math.max(180,Math.floor(cb-o))+'px')}

function saveWin(n,st){progress.stars[n]=Math.max(progress.stars[n]||0,st);progress.unlocked=Math.min(LEVELS,Math.max(progress.unlocked,n+1));

// lives: 5 max, one comes back every 20 minutes
const MAXL=5,REGEN=20*60*1000;
let lives={n:MAXL,next:0};
try{const s=JSON.parse(localStorage.getItem('tirtil-lives')||'null');if(s&&typeof s.n==='number')lives=s}catch(e){}
function saveLives(){try{localStorage.setItem('tirtil-lives',JSON.stringify(lives))}catch(e){}}
function tickLives(){const now=Date.now();
  while(lives.n<MAXL&&lives.next&&now>=lives.next){lives.n++;lives.next=lives.n<MAXL?lives.next+REGEN:0}
  if(lives.n>=MAXL)lives.next=0;saveLives();
  const t=lives.n>=MAXL?'DOLU':fmt(lives.next-now);
  document.getElementById('livesn').textContent=lives.n;document.getElementById('livest').textContent=t;
  const tb=document.getElementById('nltimer');if(tb)tb.textContent=lives.n>=MAXL?'Canların doldu!':fmt(lives.next-now)}
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const FREE_LIFE=n=>n<=5;function loseLife(){if(SET.infLives||FREE_LIFE(levelNo)||lives.n<=0)return;if(lives.n>=MAXL)lives.next=Date.now()+REGEN;lives.n--;saveLives();tickLives()}
function refillLives(){lives={n:MAXL,next:0};saveLives();tickLives()}

const STEP=96,PAD_TOP=150,PAD_BOT=250;
function nodePos(i,w){return{x:w/2+Math.sin(i*.85)*w*.28,y:PAD_TOP+(LEVELS-i)*STEP}}
function renderMap(){
  const inner=document.getElementById('mapin'),w=inner.clientWidth||360,H=PAD_TOP+(LEVELS-1)*STEP+PAD_BOT;
  inner.style.height=H+'px';inner.querySelectorAll('.node,.mapchar,.mapme,.mapdeco').forEach(e=>e.remove());
  const cur=progress.unlocked;
  // trail
  const pts=[];for(let i=1;i<=LEVELS;i++)pts.push(nodePos(i,w));
  let d=`M${pts[0].x} ${pts[0].y}`;for(let i=1;i<pts.length;i++){const p0=pts[i-1],p1=pts[i];d+=` C${p0.x} ${p0.y-STEP/2} ${p1.x} ${p1.y+STEP/2} ${p1.x} ${p1.y}`}
  const done=pts.slice(0,cur);let d2=`M${done[0].x} ${done[0].y}`;for(let i=1;i<done.length;i++){const p0=done[i-1],p1=done[i];d2+=` C${p0.x} ${p0.y-STEP/2} ${p1.x} ${p1.y+STEP/2} ${p1.x} ${p1.y}`}
  const tr=document.getElementById('trail');tr.setAttribute('width',w);tr.setAttribute('height',H);
  tr.innerHTML=`<path d="${d}" fill="none" stroke="#c9b58e" stroke-width="22" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#f3e6c8" stroke-width="14" stroke-linecap="round"/>
    <path d="${d2}" fill="none" stroke="#ffcf2e" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 14"/>`;
  // scenery: soft bushes and flowers, and the painters along the way
  const seeded=mulberry32(4242);
  for(let k=0;k<70;k++){const y=PAD_TOP-60+seeded()*(H-PAD_TOP),side=seeded()<.5,x=side?seeded()*w*.16:w-seeded()*w*.16,s=14+seeded()*26;
    const e=document.createElement('i');e.className='mapdeco';e.style.cssText=`left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;background:${['#a8e39a','#8fd781','#ffd0e0','#fff1a8','#bde8ff'][Math.floor(seeded()*5)]};opacity:.8`;inner.appendChild(e)}
  const ids=['cilek','tilki','civciv','kurbaga','damla','baykus','domuz','ahtapot','ayi','panda'];
  for(let i=3;i<=LEVELS;i+=5){const p=nodePos(i,w),t=document.getElementById('tpl-'+ids[((i-3)/5)%ids.length]);if(!t)continue;
    const c=document.createElement('div');c.className='mapchar';const off=p.x<w/2?w*.3:-w*.3;
    c.style.left=Math.max(30,Math.min(w-30,p.x+off))+'px';c.style.top=(p.y+10)+'px';c.style.setProperty('--dl',`-${(i*.37)%2.6}s`);
    c.appendChild(t.content.firstElementChild.cloneNode(true));inner.appendChild(c)}
  for(let i=1;i<=LEVELS;i++){const p=nodePos(i,w),df=diffOf(i),b=document.createElement('button');
    const locked=!SET.allOpen&&i>cur,isCur=i===cur&&!(progress.done&&i===LEVELS&&progress.stars[i]);
    b.className=`node ${df} ${isBoss(i)?'boss':''} ${locked?'locked':''} ${isCur?'cur':''}`;b.style.left=p.x+'px';b.style.top=p.y+'px';
    b.setAttribute('aria-label',`Bölüm ${i}${locked?', kilitli':''}`);
    b.innerHTML=(locked?LOCK:i)+(isBoss(i)?'<span class="ntag boss">BOSS</span>':df!=='normal'?`<span class="ntag ${df}">${DIFF_NAME[df].toUpperCase()}</span>`:'')+(FEAT_AT[i]?'<span class="ntag new">YENİ</span>':'')+
      (progress.stars[i]?`<span class="nstars">${STARROW(progress.stars[i])}</span>`:'');
    b.onclick=()=>locked?toast('Önce önceki bölümleri bitir'):openLevel(i);inner.appendChild(b);
    if(i===cur){const m=document.createElement('div');m.className='mapme';m.appendChild(document.querySelector('#mascot .msvg').cloneNode(true));
      m.insertAdjacentHTML('beforeend','<span class="nametag">Kuby</span>');m.style.left=(p.x+(p.x<w/2?34:-104))+'px';m.style.top=(p.y+30)+'px';inner.appendChild(m)}}
}

const GEAR_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l1.6 2.3 2.7-.8.6 2.8 2.7.9-.8 2.7 2.2 1.7-2.2 1.7.8 2.7-2.7.9-.6 2.8-2.7-.8L12 21.2l-1.6-2.3-2.7.8-.6-2.8-2.7-.9.8-2.7L3 12l2.2-1.7-.8-2.7 2.7-.9.6-2.8 2.7.8Z" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.4" fill="#5c33b0"/></svg>';

  const g=document.getElementById('dget');if(g)g.onclick=()=>{const r=DAILY[st.day];daily={day:st.day,last:dstr(new Date())};saveDaily();
    let msg=[];if(r.c){coins+=r.c;saveCoins();syncCoins();msg.push('+'+r.c+' altın')}if(r.b){giveBoost(r.b);msg.push(BOOST[r.b].name)}
    if(r.rnd)randomBoosts(r.rnd).forEach(b=>msg.push(b.name));sfx('gift');setTimeout(()=>sfx('coin'),200);closePop();toast('Aldın: '+msg.join(', '));updHomeMeta()}}
const totalStars=()=>Object.values(progress.stars).reduce((a,b)=>a+b,0);
const chestReady=()=>Math.floor(totalStars()/10)>(progress.chests||0);
function openChest(){const ts=totalStars(),have=ts-(progress.chests||0)*10;
  if(!chestReady()){popup(`<div class="endcard"><div class="banner">YILDIZ SANDIĞI</div><div class="chestbig">${CHEST_SVG}</div>
      <p class="endtxt">Her 10 yıldızda bir sandık açılır.</p><div class="progline"><div class="prog2"><i style="width:${Math.min(100,have*10)}%"></i></div><b>${Math.min(10,have)}/10</b></div></div>`);return}
  progress.chests=(progress.chests||0)+1;saveProgress();coins+=60;saveCoins();syncCoins();const got=randomBoosts(2);sfx('gift');
  popup(`<div class="endcard"><div class="banner">SANDIK AÇILDI!</div><div class="chestbig open">${CHEST_SVG}</div>
    <div class="loot"><span>${COIN_SVG}<b>+60</b></span>${got.map(b=>`<span><i class="boost mini" data-b="${b.id}"><span class="ic">${B_ICON[b.id]}</span></i><b>${b.name}</b></span>`).join('')}</div>
    <button class="bigbtn green" id="cok">SÜPER!</button></div>`);
  document.getElementById('cok').onclick=()=>{closePop();updHomeMeta()};updHomeMeta()}
function updHomeMeta(){const d=document.getElementById('dailybtn'),c=document.getElementById('chestbtn');if(!d||!c)return;
  d.classList.toggle('ready',dailyState().can);const ts=totalStars(),have=ts-(progress.chests||0)*10;
  c.classList.toggle('ready',chestReady());c.querySelector('small').textContent=chestReady()?'AÇ!':Math.min(10,have)+'/10'}

// Kuby'nin dolabı: şapkalar ve aksesuarlar
const HATS=[{id:'beret',n:'Bere',c:0},{id:'party',n:'Parti şapkası',c:150},{id:'flower',n:'Çiçek',c:120},{id:'pirate',n:'Korsan',c:250},{id:'crown',n:'Taç',c:300}];
const ACCS=[{id:'none',n:'Yok',c:0},{id:'bow',n:'Papyon',c:100},{id:'scarf',n:'Atkı',c:120},{id:'glasses',n:'Gözlük',c:150}];
let look={hat:'beret',acc:'none',owned:['beret','none']};try{const s=JSON.parse(localStorage.getItem('tirtil-look')||'null');if(s)look=s}catch(e){}
function saveLook(){try{localStorage.setItem('tirtil-look',JSON.stringify(look))}catch(e){}applyLook()}
function applyLook(){document.body.dataset.hat=look.hat;document.body.dataset.acc=look.acc}
applyLook();
function wardrobeHTML(){const card=(it,kind)=>{const own=look.owned.includes(it.id),on=look[kind]===it.id;
    return `<div class="witem ${on?'on':''}"><div class="kprev" data-hat="${kind==='hat'?it.id:'none'}" data-acc="${kind==='acc'?it.id:'none'}">${document.querySelector('#mascot .msvg').outerHTML}</div>
      <b>${it.n}</b>${on?'<button class="wbtn on" disabled>GİYDİ</button>':own?`<button class="wbtn" data-wear="${kind}:${it.id}">GİY</button>`:`<button class="wbtn buy ${coins<it.c?'poor':''}" data-buy="${kind}:${it.id}:${it.c}">${COIN_MINI}${it.c}</button>`}</div>`};
  return `<h3 class="shead">KUBY'NİN DOLABI</h3><div class="wgrid">${HATS.map(h=>card(h,'hat')).join('')}</div><div class="wgrid">${ACCS.map(a=>card(a,'acc')).join('')}</div>`}
function bindWardrobe(el){el.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.wear.split(':');look[k]=id;saveLook();sfx('boost');renderShop()});
  el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const[k,id,c]=b.dataset.buy.split(':');if(coins<+c){toast('Yeterli altının yok');return}
    coins-=+c;saveCoins();syncCoins();look.owned.push(id);look[k]=id;saveLook();sfx('gift');toast('Kuby çok yakıştı!');renderShop()})}

// ayarlar
function showSettings(){const tg=(k,label,on)=>`<button class="tgl ${on?'on':''}" data-k="${k}"><span>${label}</span><i></i></button>`;
  popup(`<div class="endcard"><div class="banner">AYARLAR</div><div class="setlist">
    ${tg('sfx','Ses efektleri',SND.sfx)}${tg('music','Müzik',SND.music)}${tg('vib','Titreşim',SET.vib)}
    <h4>Test</h4>${tg('allOpen','Tüm bölümler açık',SET.allOpen)}${tg('infLives','Sınırsız can',SET.infLives)}</div>
    <button class="bigbtn orange" id="sreset">İLERLEMEYİ SIFIRLA</button></div>`);
  document.querySelectorAll('.tgl').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==='sfx'||k==='music'){SND[k]=!SND[k];saveSnd();syncSndBtns();if(k==='music'){SND.music?musicStart():musicStop()}b.classList.toggle('on',SND[k])}
    else{SET[k]=!SET[k];saveSet();b.classList.toggle('on',SET[k]);if(k==='vib'&&SET.vib)vibe(40);if(k==='allOpen')renderMap();if(k==='infLives'&&SET.infLives)refillLives()}});
  document.getElementById('sreset').onclick=()=>{popup(`<div class="endcard"><div class="banner red">EMİN MİSİN?</div>
      <p class="endtxt" style="margin-top:6px">Bütün yıldızların, altınların, güçlerin ve Kuby'nin kıyafetleri silinir.</p>
      <button class="bigbtn orange" id="ryes">EVET, SIFIRLA</button><div class="endbtns"><button class="bigbtn green" id="rno">VAZGEÇ</button></div></div>`);
    document.getElementById('rno').onclick=showSettings;
    document.getElementById('ryes').onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('tirtil-')).forEach(k=>localStorage.removeItem(k))}catch(e){}
      progress={unlocked:1,stars:{}};coins=300;inv={};gifts={};seen={};daily={day:-1,last:''};look={hat:'beret',acc:'none',owned:['beret','none']};
      saveProgress();saveCoins();saveInv();saveSeen();saveDaily();saveLook();refillLives();closePop();showHome();toast('Her şey sıfırlandı')}}}
document.querySelector('.hsnd').insertAdjacentHTML('beforeend',`<button class="sndbtn gear" id="gearbtn" aria-label="Ayarlar">${GEAR_SVG}</button>`);
document.getElementById('gearbtn').onclick=e=>{e.stopPropagation();showSettings()};
document.querySelector('.hsnd').insertAdjacentHTML('afterend',`<div class="hside"><button class="sidebtn" id="dailybtn" aria-label="Günlük hediye">${GIFT_SVG}<small>HEDİYE</small></button><button class="sidebtn" id="chestbtn" aria-label="Yıldız sandığı">${CHEST_SVG}<small>0/10</small></button></div>`);
document.getElementById('dailybtn').onclick=showDaily;document.getElementById('chestbtn').onclick=openChest;

// oyun içi menü: ses, müzik, baştan başla, nasıl oynanır
function gameMenu(){const tg=(k,label,on)=>`<button class="tgl ${on?'on':''}" data-k="${k}"><span>${label}</span><i></i></button>`;
  popup(`<div class="endcard"><div class="banner">MENÜ</div><div class="setlist">${tg('sfx','Ses efektleri',SND.sfx)}${tg('music','Müzik',SND.music)}</div>
    <button class="bigbtn orange" id="gmrestart">BAŞTAN BAŞLA</button><button class="textbtn" id="gmhow">Nasıl oynanır?</button></div>`);
  document.querySelectorAll('.tgl').forEach(b=>b.onclick=()=>{const k=b.dataset.k;SND[k]=!SND[k];saveSnd();syncSndBtns();if(k==='music'){SND.music?musicStart():musicStop()}b.classList.toggle('on',SND[k])});
  document.getElementById('gmrestart').onclick=()=>{closePop();start(saved)};
  document.getElementById('gmhow').onclick=()=>{closePop();howTo()}}
document.getElementById('gmenu').onclick=e=>{e.stopPropagation();gameMenu()};

// ---- ana sayfa sekmesi: üstte can/altın, yanlarda hediye/sandık/ayarlar, ortada Kuby ve OYNA; altta her sayfadan dönülebilen "Ana Sayfa" düğmesi
const HOME_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5" fill="none" stroke="#6b3410" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5V15h3v4.5h5V10L12 4.6Z" fill="#ff8a5c" stroke="#6b3410" stroke-width="1.8" stroke-linejoin="round"/><rect x="10.5" y="15" width="3" height="4.5" fill="#ffcf2e"/></svg>';
(function buildHub(){const hv=document.querySelector('.hview');const h=document.createElement('div');h.className='tab hub';h.id='hub';h.hidden=true;hv.appendChild(h);
  const nav=document.querySelector('.hnav');const nb=document.createElement('button');nb.dataset.tab='hub';nb.innerHTML=HOME_SVG+'Ana Sayfa';nav.insertBefore(nb,nav.children[1]);
  nb.onclick=()=>setTab('hub')})();
function renderHub(){const h=document.getElementById('hub');
  const V=(c,extra={})=>({hidden:false,rainbow:false,color:c,sleep:false,ice:0,lock:null,keyId:null,timer:0,cham:null,...extra});
  const deco=[[[[0,0],[0,1]],'right',V('#ef3d55'),'8%','74%',-14,84,42],[[[0,0],[0,1]],'left',V('#4cc3f0'),'66%','80%',12,84,42],[[[0,0],[1,0]],'down',V('#ffcf2e'),'3%','52%',8,42,84],
    [[[0,0],[0,1]],'right',V('#43c463'),'70%','58%',-10,84,42],[[[1,0],[1,1],[0,1]],'up',V('#8e5be8'),'80%','30%',6,84,84]];
  const ts=totalStars(),done=Object.keys(progress.stars).length,n=progress.unlocked,df=diffOf(n);
  h.innerHTML=`<div class="tdeco">${deco.map(([c,d,v,x,y,r,w,hh],i)=>`<div class="ttube" style="left:${x};top:${y};--r:${r}deg;--dl:${-i*.7}s;width:${w}px;height:${hh}px">${catSVG(c,d,v)}</div>`).join('')}</div>
    <div class="hubin">
      <div class="tkuby"></div>
      <div class="hubstats"><span>${STARROW(3).replace(/class=""/g,'class="on"').split('</svg>')[0]}</svg><b>${ts}</b> yıldız</span><span>🖼️ <b>${done}/${LEVELS}</b> resim</span></div>
      <button class="bigbtn green tplay" id="hubplay"><span>OYNA</span><small>Bölüm ${n}${isBoss(n)?' · BOSS':df!=='normal'?' · '+DIFF_NAME[df]:''}</small></button>
    </div>`;
  h.querySelector('.hubstats span:nth-child(2)').innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="#fbf6ec" stroke="#6b3410" stroke-width="1.8"/><path d="M5.5 17l4.5-5 3 3 2-2 3.5 4" fill="#43c463" stroke="#2f6b2a" stroke-width="1.4" stroke-linejoin="round"/></svg><b>${done}/${LEVELS}</b> resim`;
  h.querySelector('.tkuby').appendChild(document.querySelector('#mascot .msvg').cloneNode(true));
  document.getElementById('hubplay').onclick=()=>openLevel(progress.unlocked)}
const _setTab=setTab;
setTab=function(t){const hub=t==='hub';_setTab(hub?'none':t);document.getElementById('hub').hidden=!hub;
  document.querySelectorAll('.hnav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('.hside,.hsnd').forEach(e=>e.style.display=(t==='map'||hub)?'':'none');
  if(hub)renderHub()};

showHome();setTab('hub');
</script>
